# action.yml
name: "AI Code Reviewer"
description: "Use OpenAI or Claude to review Pull Requests automatically."
author: "ChangHwan Lee"
runs:
  using: "docker"
  image: "Dockerfile"
  
inputs:
  GITHUB_TOKEN:
    description: "GitHub token for API calls."
    required: true
  OPENAI_API_KEY:
    description: "OpenAI API key for ChatGPT(O1). Either this or ANTHROPIC_API_KEY is required."
    required: false
  ANTHROPIC_API_KEY:
    description: "Anthropic API key for Claude Code SDK. Either this or OPENAI_API_KEY is required."
    required: false
  PR_NUMBER:
    description: "Pull Request number."
    required: true
  SYSTEM_PROMPT:
    description: "System prompt for the AI model."
    required: false
